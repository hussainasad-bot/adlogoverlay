org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Release ------------------------------------------------------------------------------
# The version published to Maven Central. A release is triggered by pushing the tag
# v<VERSION_NAME>; the publish workflow refuses a tag that does not match this.
VERSION_NAME=1.0.0

# <owner>/<repo> on GitHub. It becomes the project and source links in the published POM, which
# Maven Central requires and which can never be changed for a released version. The publish
# workflow sets it from the repository it runs in, so leave it empty here; it only needs a value
# to publish by hand, and publishing refuses to run while it is empty.
GITHUB_REPO=
